name: Create Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      frontend_release_created: ${{ steps.release.outputs['frontend--release_created'] }}
    steps:
      - name: Create Release PR or Release
        id: release
        uses: googleapis/release-please-action@v5

  deploy-frontend:
    needs: release
    if: ${{ needs.release.outputs.frontend_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Build Container
        run: |
          docker build --target build -t frontend --build-arg VITE_API_URL=https://sushi.johndoty.dev --build-arg VITE_BASE_URL=/sushi ./frontend

      - name: Create Container
        run: |
          docker create --name frontend-build frontend

      - name: Copy build
        run: |
          docker cp frontend-build:/app/dist ./dist

      - name: Copy index.html as custom 404
        run: cp ./dist/index.html ./dist/404.html

      - name: Setup pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
