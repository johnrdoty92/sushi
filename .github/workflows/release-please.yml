name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  issues: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release PR or Release
        id: release
        uses: googleapis/release-please-action@v5

      - name: Checkout main
        if: ${{ steps.release.outputs['frontend--release_created'] }}
        uses: actions/checkout@v7

