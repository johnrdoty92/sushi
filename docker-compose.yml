services:
  server:
    build:
      context: ./server
      target: dev
    ports:
      - 5001:5001
    environment:
      - HOST=0.0.0.0
      - PORT=5001
      - CLIENT_ORIGIN=http://localhost:5173
  frontend:
    environment:
      - VITE_API_URL=http://localhost:5001
    build:
      context: ./frontend
    ports:
      - 5173:5173
    volumes:
      - ./frontend/src:/app/src
